name: fish_identifier
description: AI-powered fish identification app using YOLOv8
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # ML
  tflite_flutter: ^0.11.0
  opencv_dart: ^1.0.0
  
  # Image Processing
  image_picker: ^1.0.4
  image: ^4.1.3
  
  # DI
  get_it: ^7.6.4
  
  # UI
  google_fonts: ^6.1.0
  
  # Utils
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.5.3
  permission_handler: ^11.0.1
  geolocator: ^13.0.4
  dio: ^5.9.0
  connectivity_plus: ^6.0.3
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  pinput: ^4.0.0
  camera: ^0.10.5+9
  flutter_tts: ^3.8.5
  
  # AR

  vector_math: ^2.1.4
  ar_flutter_plugin_updated: ^0.0.1
  dropdown_button2: ^2.3.9
  google_maps_flutter: ^2.14.0
  geocoding: ^4.0.0
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  google_generative_ai: ^0.4.7
  share_plus: ^10.0.0
  iconsax_flutter: ^1.0.1
  flutter_markdown: ^0.6.18
  build_runner: ^2.4.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  # build_runner: ^2.5.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hex_code"
    theme_color: "#hex_code"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/
    - assets/images/
    - assets/data/
